  <style>
    .p-hero {
      position: relative;
      width: 100%;
      height: 82vh;
      min-height: 520px;
      overflow: hidden;
      margin-top: 80px;
    }

    .p-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) saturate(1.05);
      transform: scale(1.1);
      animation: slowZoom 16s ease-out forwards;
    }

    @keyframes slowZoom {
      from {
        transform: scale(1.14);
      }

      to {
        transform: scale(1);
      }
    }

    .p-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(26, 15, 12, 0.25) 0%, rgba(26, 15, 12, 0.15) 45%, rgba(26, 15, 12, 0.85) 100%);
    }

    .p-hero-content {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 64px;
      z-index: 2;
      padding: 0 48px;
    }

    .p-tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #EEEAE0;
      background: #8B4A34;
      padding: 8px 18px;
      border-radius: 100px;
      margin-bottom: 22px;
      font-weight: 600;
    }

    .p-title {
      font-size: clamp(38px, 6vw, 74px);
      max-width: 900px;
      color: #EEEAE0;
    }

    .p-sub {
      margin-top: 16px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #C7AF92;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      background: var(--bg-alt);
    }

    .fact {
      padding: 38px 30px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      transition: background .45s ease, color .45s ease;
      position: relative;
      overflow: hidden;
    }

    .fact::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #1a0f0c;
      transform: translateY(101%);
      transition: transform .5s cubic-bezier(.65, 0, .35, 1);
      z-index: 0;
    }

    .fact:hover::before {
      transform: translateY(0);
    }

    .fact svg,
    .fact .fact-label,
    .fact .fact-value {
      position: relative;
      z-index: 1;
    }

    .fact svg {
      width: 22px;
      height: 22px;
      margin-bottom: 16px;
      transition: transform .5s cubic-bezier(.34, 1.56, .64, 1);
    }

    .fact svg * {
      transition: stroke .45s ease, fill .45s ease;
    }

    .fact:hover svg {
      transform: rotate(-8deg) scale(1.12);
    }

    .fact:hover svg * {
      stroke: #C79A5B;
      fill: #C79A5B;
    }

    .fact .fact-label {
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7A4F3B;
      margin-bottom: 8px;
      transition: color .45s ease;
    }

    .fact:hover .fact-label {
      color: #C79A5B;
    }

    .fact .fact-value {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      color: #1a0f0c;
      transition: color .45s ease;
    }

    .fact:hover .fact-value {
      color: #EEEAE0;
    }

    .filmstrip-section {
      padding: 60px 0;
      background: var(--bg-alt);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .filmstrip-track {
      display: flex;
      gap: 20px;
      width: max-content;
      animation: filmScroll 38s linear infinite;
      will-change: transform;
    }

    .filmstrip-track:hover {
      animation-play-state: paused;
    }

    .film-frame {
      width: 360px;
      height: 240px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      position: relative;
    }

    .film-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(15%) brightness(0.92);
      transition: filter .5s ease, transform .6s ease;
    }

    .film-frame:hover img {
      filter: grayscale(0%) brightness(1);
      transform: scale(1.08);
    }

    @keyframes filmScroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .showcase-section {
      padding: 60px 48px 120px;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .showcase-item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      aspect-ratio: 16/10;
      background: var(--panel);
    }

    .showcase-item.wide {
      grid-column: span 2;
      aspect-ratio: 21/9;
    }

    .showcase-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(10%) brightness(0.92);
      transition: transform 0.9s cubic-bezier(.19, 1, .22, 1), filter 0.6s ease;
    }

    .showcase-item:hover img {
      transform: scale(1.06);
      filter: grayscale(0%) brightness(1);
    }

    /* Accordion & Morph Slider Section (Exact match to video specs) */
    .zones-section {
      padding: 90px 48px 60px;
      background: #EEEAE0;
      border-top: 1px solid var(--line);
    }

    /* Section Head Typography & Spacing */
    .section-head {
      margin-bottom: 36px;
    }

    .section-head .eyebrow {
      font-size: 11.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8B4A34;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .section-head h2 {
      font-family: 'Fraunces', serif;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.2;
      color: #1a0f0c;
      margin: 0 0 14px 0;
      letter-spacing: -0.01em;
    }

    .section-desc {
      font-size: 15.5px;
      color: #5C4335;
      line-height: 1.65;
      max-width: 620px;
      margin: 0;
    }

    /* Accordion Gallery — Hover Responsive (matching rec1.mp4) */
    .accordion-gallery-wrapper {
      width: 100%;
      margin-bottom: 44px;
    }

    .accordion-gallery {
      display: flex;
      gap: 12px;
      height: 480px;
      width: 100%;
    }

    .acc-card {
      flex: 1;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      background: #0f0806;
      transition: flex 0.68s cubic-bezier(.22, 1, .36, 1), box-shadow 0.4s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .acc-card:hover,
    .acc-card.active {
      flex: 5.5;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .acc-card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(85%) brightness(0.5);
      transition: filter 0.6s ease, transform 0.8s cubic-bezier(.22, 1, .36, 1);
    }

    .acc-card:hover .acc-card-img,
    .acc-card.active .acc-card-img {
      filter: grayscale(0%) brightness(1);
      transform: scale(1.05);
    }

    .acc-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
    }

    .acc-label-box {
      position: absolute;
      bottom: 28px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 3;
      pointer-events: none;
      white-space: nowrap;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .acc-bar {
      width: 3.5px;
      height: 22px;
      background: #FFF8EE;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .acc-label-text {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 500;
      color: #FFF8EE;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      opacity: 0.9;
    }

    .acc-card:hover .acc-label-text,
    .acc-card.active .acc-label-text {
      font-size: 24px;
      opacity: 1;
    }

    /* Morph Slider (Dual-Layer GPU Crossfade for 120fps Silky Transitions) */
    .morph-slider-container {
      width: 100%;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .morph-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.2;
      max-height: 600px;
      border-radius: 24px;
      overflow: hidden;
      background: #0d0705;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(238, 234, 224, 0.12);
      user-select: none;
      touch-action: pan-y pinch-zoom;
    }

    .morph-slide-content {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: zoom-in;
      overflow: hidden;
    }

    .morph-slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.4s cubic-bezier(.25, 1, .35, 1), transform 0.55s cubic-bezier(.25, 1, .35, 1);
      will-change: opacity, transform;
      pointer-events: none;
    }

    .morph-slide-img.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .morph-viewport:hover .morph-slide-img.active {
      transform: scale(1.025);
    }

    /* Left & Right Circular Nav Buttons */
    .morph-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 8, 6, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFF8EE;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
      will-change: transform;
    }

    .morph-nav-btn.prev {
      left: 20px;
    }

    .morph-nav-btn.next {
      right: 20px;
    }

    .morph-nav-btn:hover {
      background: rgba(139, 74, 52, 0.85);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-50%) scale(1.1);
    }

    .morph-nav-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Bottom Center Dots / Capsule Indicators */
    .morph-dots-wrapper {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 8, 6, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 7px 16px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
      max-width: 90%;
      overflow-x: auto;
    }

    .morph-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: width 0.35s cubic-bezier(.22, 1, .36, 1), background 0.35s ease, border-radius 0.35s ease;
      flex-shrink: 0;
    }

    .morph-dot:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .morph-dot.active {
      width: 24px;
      height: 7px;
      border-radius: 6px;
      background: #FFFFFF;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    /* Lightbox Modal */
    .insights-lightbox {
      position: fixed;
      inset: 0;
      z-index: 600;
      background: rgba(15, 8, 6, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }

    .insights-lightbox.open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease;
    }

    .insights-lb-inner {
      max-width: min(1200px, 90vw);
      max-height: 85vh;
      position: relative;
      transform: scale(0.94);
      transition: transform 0.4s cubic-bezier(.19, 1, .22, 1);
    }

    .insights-lightbox.open .insights-lb-inner {
      transform: scale(1);
    }

    .insights-lb-inner img {
      max-width: 100%;
      max-height: 80vh;
      display: block;
      border-radius: 12px;
      border: 1px solid rgba(238, 234, 224, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .insights-lb-caption {
      margin-top: 14px;
      color: #EEEAE0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .insights-lb-caption h4 {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 400;
    }

    .insights-lb-close {
      position: fixed;
      top: 28px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(238, 234, 224, 0.1);
      border: 1px solid rgba(238, 234, 224, 0.2);
      color: #EEEAE0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
      z-index: 610;
    }

    .insights-lb-close:hover {
      background: #8B4A34;
      transform: rotate(90deg) scale(1.08);
    }

    .insights-lb-close svg {
      width: 18px;
      height: 18px;
    }

    /* VR Experience Section */
    .vr-experience-section {
      padding: 90px 48px 80px;
      background: #EEEAE0;
      border-top: 1px solid var(--line);
    }

    .vr-rooms-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .vr-room-card {
      position: relative;
      height: 210px;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      background: #0f0806;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      transition: transform 0.4s cubic-bezier(.22, 1, .36, 1), border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .vr-room-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    }

    .vr-room-card.active {
      border-color: #8B4A34;
      box-shadow: 0 14px 36px rgba(139, 74, 52, 0.35);
    }

    .vr-room-thumb {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.65) saturate(1.05);
      transition: transform 0.6s cubic-bezier(.22, 1, .36, 1), filter 0.4s ease;
    }

    .vr-room-card:hover .vr-room-thumb,
    .vr-room-card.active .vr-room-thumb {
      transform: scale(1.06);
      filter: brightness(0.8) saturate(1.15);
    }

    .vr-room-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.9) 100%);
      pointer-events: none;
    }

    .vr-room-info {
      position: absolute;
      bottom: 16px;
      left: 18px;
      right: 18px;
      z-index: 2;
      pointer-events: none;
    }

    .vr-room-info h3 {
      font-family: 'Fraunces', serif;
      font-size: 19px;
      color: #FFF8EE;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .vr-tap-hint {
      font-size: 11.5px;
      color: #C7AF92;
      font-weight: 500;
      display: block;
      opacity: 0.85;
    }

    /* VR Viewer Frame */
    .vr-viewer-wrapper {
      background: #110907;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(238, 234, 224, 0.15);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .vr-viewer-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(26, 15, 12, 0.95);
      border-bottom: 1px solid rgba(238, 234, 224, 0.1);
      color: #EEEAE0;
    }

    .vr-active-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #FFF8EE;
    }

    .vr-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 10px #2ecc71;
      animation: vrPulse 2s infinite;
    }

    @keyframes vrPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .vr-fullscreen-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(238, 234, 224, 0.1);
      border: 1px solid rgba(238, 234, 224, 0.2);
      color: #EEEAE0;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .vr-fullscreen-btn:hover {
      background: #8B4A34;
      color: #FFF8EE;
      transform: scale(1.04);
    }

    .vr-fullscreen-btn svg {
      width: 14px;
      height: 14px;
    }

    .vr-iframe-container {
      position: relative;
      width: 100%;
      height: 600px;
      background: #000;
    }

    .vr-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .p-cta {
      text-align: center;
      border-top: 1px solid var(--line-soft);
      background: #EEEAE0;
      padding: 110px 48px;
    }

    .p-cta h2 {
      font-size: clamp(30px, 4.5vw, 48px);
      max-width: 640px;
      margin: 0 auto 30px;
      color: #1a0f0c;
    }

    .p-cta-btn {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: #1a0f0c;
      color: #EEEAE0;
      padding: 17px 38px;
      border-radius: 100px;
      transition: transform .35s ease, background .35s ease;
    }

    .p-cta-btn:hover {
      transform: translateY(-3px);
      background: #8B4A34;
      color: #EEEAE0;
    }

    .not-found {
      padding: 220px 48px;
      text-align: center;
    }

    function initAccordionAndSlider(p) {
      let activeZoneIndex = 0;
      let activeSlideIndex = 0;
      let currentLayer = 'A';

      // Preload images into memory so all switches are instantaneous
      p.zones.forEach(z => {
        z.images.forEach(img => {
          const pre = new Image();
          pre.src = img.src;
        });
      });

      const accCards = document.querySelectorAll('.acc-card');
      const morphImgA = document.getElementById('morphImgA');
      const morphImgB = document.getElementById('morphImgB');
      const morphDotsWrapper = document.getElementById('morphDotsWrapper');
      const morphPrevBtn = document.getElementById('morphPrevBtn');
      const morphNextBtn = document.getElementById('morphNextBtn');
      const morphViewport = document.getElementById('morphViewport');

      const lightbox = document.getElementById('insightsLightbox');
      const lbImg = document.getElementById('insightsLbImg');
      const lbTitle = document.getElementById('insightsLbTitle');
      const lbZone = document.getElementById('insightsLbZone');
      const lbClose = document.getElementById('insightsLbClose');

      function updateSlide(zoneIdx, slideIdx, animate = true) {
        const zone = p.zones[zoneIdx];
        if (!zone || !zone.images[slideIdx]) return;

        const imgData = zone.images[slideIdx];
        activeZoneIndex = zoneIdx;
        activeSlideIndex = slideIdx;

        if (animate) {
          const nextLayer = currentLayer === 'A' ? 'B' : 'A';
          const nextImg = nextLayer === 'A' ? morphImgA : morphImgB;
          const currImg = currentLayer === 'A' ? morphImgA : morphImgB;

          nextImg.src = imgData.src;
          nextImg.alt = imgData.title;

          nextImg.classList.add('active');
          currImg.classList.remove('active');
          currentLayer = nextLayer;
        } else {
          const currImg = currentLayer === 'A' ? morphImgA : morphImgB;
          currImg.src = imgData.src;
          currImg.alt = imgData.title;
        }

        // Update dots
        document.querySelectorAll('.morph-dot').forEach((d, i) => {
          if (i === slideIdx) d.classList.add('active');
          else d.classList.remove('active');
        });
      }

      function loadZone(zoneIdx) {
        const zone = p.zones[zoneIdx];
        if (!zone) return;

        accCards.forEach((card, idx) => {
          if (idx === zoneIdx) card.classList.add('active');
          else card.classList.remove('active');
        });

        // Build dots
        morphDotsWrapper.innerHTML = zone.images.map((img, i) => `
          <div class="morph-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>
        `).join('');

        // Attach dot click listeners
        document.querySelectorAll('.morph-dot').forEach(dot => {
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(dot.dataset.index, 10);
            updateSlide(zoneIdx, idx, true);
          });
        });

        updateSlide(zoneIdx, 0, true);
      }

      // Hover-responsive accordion as requested in user prompt
      accCards.forEach((card, idx) => {
        card.addEventListener('mouseenter', () => {
          if (activeZoneIndex !== idx) {
            loadZone(idx);
          }
        });
        card.addEventListener('click', () => {
          if (activeZoneIndex !== idx) {
            loadZone(idx);
          }
        });
      });

      if (morphPrevBtn) {
        morphPrevBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const zone = p.zones[activeZoneIndex];
          const prevIdx = (activeSlideIndex - 1 + zone.images.length) % zone.images.length;
          updateSlide(activeZoneIndex, prevIdx, true);
        });
      }

      if (morphNextBtn) {
        morphNextBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const zone = p.zones[activeZoneIndex];
          const nextIdx = (activeSlideIndex + 1) % zone.images.length;
          updateSlide(activeZoneIndex, nextIdx, true);
        });
      }

      // Mobile touch swipe gestures
      let touchStartX = 0;
      let touchEndX = 0;
      if (morphViewport) {
        morphViewport.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        morphViewport.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          const diff = touchStartX - touchEndX;
          if (Math.abs(diff) > 40) {
            const zone = p.zones[activeZoneIndex];
            if (diff > 0) {
              // Swipe left -> next
              const nextIdx = (activeSlideIndex + 1) % zone.images.length;
              updateSlide(activeZoneIndex, nextIdx, true);
            } else {
              // Swipe right -> prev
              const prevIdx = (activeSlideIndex - 1 + zone.images.length) % zone.images.length;
              updateSlide(activeZoneIndex, prevIdx, true);
            }
          }
        }, { passive: true });
      }

      // Lightbox open on click
      if (morphViewport && lightbox) {
        morphViewport.addEventListener('click', () => {
          const zone = p.zones[activeZoneIndex];
          const imgData = zone.images[activeSlideIndex];
          lbImg.src = imgData.src;
          lbTitle.textContent = imgData.title;
          lbZone.textContent = `${zone.name} — Render ${activeSlideIndex + 1} of ${zone.images.length}`;
          lightbox.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
      }

      function closeLb() {
        if (lightbox) {
          lightbox.classList.remove('open');
          document.body.style.overflow = '';
        }
      }

      if (lbClose) lbClose.addEventListener('click', closeLb);
      if (lightbox) {
        lightbox.addEventListener('click', (e) => {
          if (e.target === lightbox) closeLb();
        });
      }

      document.addEventListener('keydown', (e) => {
        if (lightbox && lightbox.classList.contains('open')) {
          if (e.key === 'Escape') closeLb();
          if (e.key === 'ArrowRight') {
            const zone = p.zones[activeZoneIndex];
            const nextIdx = (activeSlideIndex + 1) % zone.images.length;
            updateSlide(activeZoneIndex, nextIdx, false);
            const imgData = zone.images[nextIdx];
            lbImg.src = imgData.src;
            lbTitle.textContent = imgData.title;
            lbZone.textContent = `${zone.name} — Render ${nextIdx + 1} of ${zone.images.length}`;
          }
          if (e.key === 'ArrowLeft') {
            const zone = p.zones[activeZoneIndex];
            const prevIdx = (activeSlideIndex - 1 + zone.images.length) % zone.images.length;
            updateSlide(activeZoneIndex, prevIdx, false);
            const imgData = zone.images[prevIdx];
            lbImg.src = imgData.src;
            lbTitle.textContent = imgData.title;
            lbZone.textContent = `${zone.name} — Render ${prevIdx + 1} of ${zone.images.length}`;
          }
        } else {
          if (e.key === 'ArrowRight' && morphNextBtn) {
            const zone = p.zones[activeZoneIndex];
            const nextIdx = (activeSlideIndex + 1) % zone.images.length;
            updateSlide(activeZoneIndex, nextIdx, true);
          }
          if (e.key === 'ArrowLeft' && morphPrevBtn) {
            const zone = p.zones[activeZoneIndex];
            const prevIdx = (activeSlideIndex - 1 + zone.images.length) % zone.images.length;
            updateSlide(activeZoneIndex, prevIdx, true);
          }
        }
      });

      // Initial load
      loadZone(0);
    }

    function initVRExperience() {
      const cards = document.querySelectorAll('.vr-room-card');
      const iframe = document.getElementById('vrIframe');
      const titleEl = document.getElementById('vrActiveRoomTitle');
      const fullscreenBtn = document.getElementById('vrFullscreenBtn');
      const container = document.getElementById('vrIframeContainer');

      cards.forEach(card => {
        card.addEventListener('click', () => {
          cards.forEach(c => c.classList.remove('active'));
          card.classList.add('active');

          const vrUrl = card.dataset.vr;
          const roomName = card.dataset.name;

          if (titleEl) titleEl.textContent = roomName;
          if (iframe && iframe.src !== vrUrl) {
            iframe.src = vrUrl;
          }

          // Smooth scroll to the viewer frame on smaller screens so the user sees the VR view
          const wrapper = document.getElementById('vrViewerWrapper');
          if (wrapper && window.innerWidth < 900) {
            wrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
      });

      if (fullscreenBtn && container) {
        fullscreenBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
              window.open('https://panoraven.com/en/embed/RdJaToZd29', '_blank');
            });
          } else {
            document.exitFullscreen();
          }
        });
      }
    }

    function renderNotFound() {
      app.innerHTML = `
      <div class="not-found">
        <h2>We couldn't find that project.</h2>
        <a href="projects_category.html" class="p-cta-btn">← Back to All Projects</a>
      </div>`;
    }

    function initReveal() {
      const els = document.querySelectorAll('.reveal, .reveal-img');
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add('in'), i * 40);
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      els.forEach(el => io.observe(el));
    }

    if (project) { render(project); } else { renderNotFound(); }
  </script>

  <script src="global.js"></script>
</body>

</html>
