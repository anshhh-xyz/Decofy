<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="0" y="0" width="1000" height="700" fill="#EDE9DE"/>

  <!-- ============ MAP/BLUEPRINT BOUNDARY & GRID ============ -->
  <g opacity="0.75">
    <!-- Outer dashed boundary frame -->
    <rect x="25" y="25" width="950" height="650" fill="none" stroke="#8a8578" stroke-width="1.6" stroke-dasharray="10 6"/>
    <!-- Inner hairline border -->
    <rect x="33" y="33" width="934" height="634" fill="none" stroke="#2b2b28" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Corner crosshairs -->
    <path d="M 15 25 H 35 M 25 15 V 35" stroke="#2b2b28" stroke-width="1.2"/>
    <path d="M 965 25 H 985 M 975 15 V 35" stroke="#2b2b28" stroke-width="1.2"/>
    <path d="M 15 675 H 35 M 25 665 V 685" stroke="#2b2b28" stroke-width="1.2"/>
    <path d="M 965 675 H 985 M 975 665 V 685" stroke="#2b2b28" stroke-width="1.2"/>

    <!-- Map datum grid lines -->
    <line x1="450" y1="25" x2="450" y2="675" stroke="#8a8578" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="650" y1="25" x2="650" y2="675" stroke="#8a8578" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="25" y1="510" x2="975" y2="510" stroke="#8a8578" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- Coordinate & datum markings -->
    <text x="42" y="20" font-family="monospace" font-size="10" fill="#8a8578" letter-spacing="1.2">LAT 26° 50' 30" N</text>
    <text x="830" y="20" font-family="monospace" font-size="10" fill="#8a8578" letter-spacing="1.2">LONG 80° 56' 40" E</text>
    <text x="42" y="693" font-family="monospace" font-size="10" fill="#8a8578" letter-spacing="1.2">ABOUT MAP · PHILOSOPHY 01</text>
  </g>

  <!-- Radius / Dimension arc -->
  <g opacity="0.65">
    <path d="M 550 70 A 180 180 0 0 1 730 250" fill="none" stroke="#8a8578" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="738" y="250" fill="#8a8578" font-family="sans-serif" font-size="11" letter-spacing="1">R180</text>
  </g>

  <!-- Hollow Exclamation / Info Symbol (!) -->
  <g>
    <!-- Upper tapered hollow stem of exclamation mark -->
    <path d="
      M 510 110
      C 510 90, 590 90, 590 110
      L 568 400
      C 568 412, 532 412, 532 400
      Z"
      fill="none" stroke="#2b2b28" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner hollow echo line inside upper stem -->
    <path d="
      M 524 125
      C 524 112, 576 112, 576 125
      L 558 385
      C 558 393, 542 393, 542 385
      Z"
      fill="none" stroke="#8a8578" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Blueprint hatch/tick marks across upper stem -->
    <line x1="520" y1="170" x2="580" y2="170" stroke="#8a8578" stroke-width="1.5"/>
    <line x1="526" y1="240" x2="574" y2="240" stroke="#8a8578" stroke-width="1.5"/>
    <line x1="531" y1="310" x2="569" y2="310" stroke="#8a8578" stroke-width="1.5"/>

    <!-- Hollow dot (lower part of !) -->
    <circle cx="550" cy="510" r="42" fill="none" stroke="#2b2b28" stroke-width="6"/>
    <!-- Inner hollow ring in dot -->
    <circle cx="550" cy="510" r="26" fill="none" stroke="#8a8578" stroke-width="3"/>
    <!-- Center crosshair in dot -->
    <line x1="550" y1="450" x2="550" y2="570" stroke="#8a8578" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="490" y1="510" x2="610" y2="510" stroke="#8a8578" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Technical annotations -->
  <g font-family="sans-serif" font-size="11" fill="#8a8578" letter-spacing="1.5">
    <text x="615" y="115">PHILOSOPHY · 01</text>
    <line x1="595" y1="110" x2="610" y2="110" stroke="#8a8578" stroke-width="1"/>
    <text x="610" y="515">EST. 2016</text>
    <line x1="595" y1="510" x2="605" y2="510" stroke="#8a8578" stroke-width="1"/>
  </g>
</svg>
