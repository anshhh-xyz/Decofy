<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="0" y="0" width="1000" height="700" fill="#EDE9DE"/>

  <!-- ============ MAP/BLUEPRINT BOUNDARY & GRID ============ -->
  <g opacity="0.75">
    <!-- Outer dashed boundary frame -->
    <rect x="25" y="25" width="950" height="650" fill="none" stroke="#8a8578" stroke-width="1.6" stroke-dasharray="10 6"/>
    <!-- Inner hairline border -->
    <rect x="33" y="33" width="934" height="634" fill="none" stroke="#2b2b28" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Corner crosshairs -->
    <path d="M 15 25 H 35 M 25 15 V 35" stroke="#2b2b28" stroke-width="1.2"/>
    <path d="M 965 25 H 985 M 975 15 V 35" stroke="#2b2b28" stroke-width="1.2"/>
    <path d="M 15 675 H 35 M 25 665 V 685" stroke="#2b2b28" stroke-width="1.2"/>
    <path d="M 965 675 H 985 M 975 665 V 685" stroke="#2b2b28" stroke-width="1.2"/>

    <!-- Map datum grid lines -->
    <line x1="300" y1="25" x2="300" y2="675" stroke="#8a8578" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="700" y1="25" x2="700" y2="675" stroke="#8a8578" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="25" y1="350" x2="975" y2="350" stroke="#8a8578" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- Coordinate & datum markings -->
    <text x="42" y="20" font-family="monospace" font-size="10" fill="#8a8578" letter-spacing="1.2">LAT 26° 50' 18" N</text>
    <text x="830" y="20" font-family="monospace" font-size="10" fill="#8a8578" letter-spacing="1.2">LONG 80° 56' 22" E</text>
    <text x="42" y="693" font-family="monospace" font-size="10" fill="#8a8578" letter-spacing="1.2">GALLERY MAP · ARCHIVE 06</text>
  </g>

  <!-- camera body -->
  <rect x="200" y="230" width="600" height="380" rx="24" fill="none" stroke="#2b2b28" stroke-width="6"/>

  <!-- viewfinder bump on top -->
  <path d="M 380 230 L 400 180 L 600 180 L 620 230" fill="none" stroke="#2b2b28" stroke-width="6" stroke-linejoin="round"/>

  <!-- flash -->
  <rect x="650" y="192" width="70" height="38" rx="6" fill="none" stroke="#2b2b28" stroke-width="4"/>

  <!-- shutter button -->
  <circle cx="270" cy="200" r="16" fill="none" stroke="#2b2b28" stroke-width="4"/>

  <!-- lens outer ring -->
  <circle cx="500" cy="430" r="130" fill="none" stroke="#2b2b28" stroke-width="6"/>
  <!-- lens middle ring -->
  <circle cx="500" cy="430" r="95" fill="none" stroke="#8a8578" stroke-width="3"/>
  <!-- lens inner glass -->
  <circle cx="500" cy="430" r="60" fill="none" stroke="#2b2b28" stroke-width="5"/>
  <!-- lens highlight -->
  <path d="M 465 400 A 60 60 0 0 1 500 370" fill="none" stroke="#8a8578" stroke-width="4" stroke-linecap="round"/>

  <!-- small indicator light -->
  <circle cx="750" cy="290" r="10" fill="none" stroke="#8a8578" stroke-width="3"/>
</svg>
