<svg viewBox="0 0 2200 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="0" y="0" width="2200" height="1400" fill="#EDE9DE"/>

  <!-- ============ MAP/BLUEPRINT BOUNDARY & GRID ============ -->
  <g opacity="0.75">
    <!-- Outer dashed boundary frame -->
    <rect x="50" y="50" width="2100" height="1300" fill="none" stroke="#8a8578" stroke-width="2.5" stroke-dasharray="18 10"/>
    <!-- Inner hairline border -->
    <rect x="66" y="66" width="2068" height="1268" fill="none" stroke="#2b2b28" stroke-width="1" opacity="0.4"/>
    
    <!-- Corner crosshairs -->
    <path d="M 30 50 H 70 M 50 30 V 70" stroke="#2b2b28" stroke-width="2"/>
    <path d="M 2130 50 H 2170 M 2150 30 V 70" stroke="#2b2b28" stroke-width="2"/>
    <path d="M 30 1350 H 70 M 50 1330 V 1370" stroke="#2b2b28" stroke-width="2"/>
    <path d="M 2130 1350 H 2170 M 2150 1330 V 1370" stroke="#2b2b28" stroke-width="2"/>

    <!-- Map datum grid lines -->
    <line x1="600" y1="50" x2="600" y2="1350" stroke="#8a8578" stroke-width="1.2" stroke-dasharray="10 8"/>
    <line x1="1600" y1="50" x2="1600" y2="1350" stroke="#8a8578" stroke-width="1.2" stroke-dasharray="10 8"/>
    <line x1="50" y1="700" x2="2150" y2="700" stroke="#8a8578" stroke-width="1.2" stroke-dasharray="10 8"/>

    <!-- Coordinate & datum markings -->
    <text x="80" y="40" font-family="monospace" font-size="16" fill="#8a8578" letter-spacing="1.5">LAT 26° 51' 12" N</text>
    <text x="1830" y="40" font-family="monospace" font-size="16" fill="#8a8578" letter-spacing="1.5">LONG 80° 57' 04" E</text>
    <text x="80" y="1382" font-family="monospace" font-size="16" fill="#8a8578" letter-spacing="1.5">SERVICES MAP · PROGRAM SPECIFICATIONS</text>
  </g>

  <!-- ============ WOOD PLANK (lying flat, like the ground-level elements) ============ -->
  <g>
    <rect x="260" y="880" width="900" height="90" rx="6" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <!-- end grain -->
    <ellipse cx="260" cy="925" rx="14" ry="45" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <ellipse cx="260" cy="925" rx="7" ry="24" fill="none" stroke="#8a8578" stroke-width="1.5"/>
    <ellipse cx="260" cy="925" rx="2.5" ry="9" fill="none" stroke="#8a8578" stroke-width="1.5"/>
    <!-- grain lines -->
    <line x1="320" y1="905" x2="1120" y2="905" stroke="#8a8578" stroke-width="1.5"/>
    <line x1="320" y1="925" x2="1120" y2="925" stroke="#8a8578" stroke-width="1.5"/>
    <line x1="320" y1="945" x2="1120" y2="945" stroke="#8a8578" stroke-width="1.5"/>
    <!-- knot -->
    <ellipse cx="640" cy="935" rx="14" ry="9" fill="none" stroke="#2b2b28" stroke-width="2"/>
    <ellipse cx="640" cy="935" rx="5" ry="3" fill="none" stroke="#2b2b28" stroke-width="1.5"/>
  </g>

  <!-- ============ NUT #1 (hex nut, resting on the plank) ============ -->
  <g transform="translate(1010,850)">
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"
      fill="none" stroke="#2b2b28" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <!-- thread ticks inside -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#8a8578" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- ============ NUT #2 (smaller, off to the side, slightly rotated) ============ -->
  <g transform="translate(1470,1000) rotate(18)">
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16"
      fill="none" stroke="#2b2b28" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#2b2b28" stroke-width="3"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#8a8578" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- ============ HAMMER (leaning diagonally across the plank) ============ -->
  <g transform="translate(1520,360) rotate(35)">
    <!-- handle: tapered grip, wider at the base -->
    <path d="M -30 -20
             C 80 -26, 220 -24, 340 -18
             C 400 -15, 440 -12, 460 -9
             C 462 -3, 462 3, 460 9
             C 440 12, 400 15, 340 18
             C 220 24, 80 26, -30 20
             C -36 8, -36 -8, -30 -20 Z"
      fill="none" stroke="#2b2b28" stroke-width="3" stroke-linejoin="round"/>
    <!-- grip ridges -->
    <line x1="-10" y1="-17" x2="-10" y2="17" stroke="#8a8578" stroke-width="1.5"/>
    <line x1="10" y1="-19" x2="10" y2="19" stroke="#8a8578" stroke-width="1.5"/>
    <line x1="30" y1="-20.5" x2="30" y2="20.5" stroke="#8a8578" stroke-width="1.5"/>

    <!-- neck collar where handle meets head -->
    <path d="M -30 -20 C -46 -22, -58 -16, -60 0 C -58 16, -46 22, -30 20 Z"
      fill="none" stroke="#2b2b28" stroke-width="3" stroke-linejoin="round"/>

    <!-- head block (striking face + back, slightly wedge-shaped) -->
    <path d="M -58 -44
             L -128 -50
             C -142 -50, -152 -42, -152 -30
             L -152 30
             C -152 42, -142 50, -128 50
             L -58 44
             C -50 30, -50 -30, -58 -44 Z"
      fill="none" stroke="#2b2b28" stroke-width="3" stroke-linejoin="round"/>
    <!-- striking face highlight ring -->
    <ellipse cx="-146" cy="0" rx="7" ry="30" fill="none" stroke="#8a8578" stroke-width="1.5"/>
    <!-- top ridge line of head -->
    <path d="M -60 -42 C -90 -47, -120 -49, -145 -47" fill="none" stroke="#8a8578" stroke-width="1.5"/>
    <path d="M -60 42 C -90 47, -120 49, -145 47" fill="none" stroke="#8a8578" stroke-width="1.5"/>

    <!-- claw, curved and split, on the opposite side of the head -->
    <path d="M -58 -44
             C -30 -70, 6 -78, 30 -62
             C 44 -53, 48 -38, 40 -26
             L 24 -34
             C 28 -42, 26 -50, 16 -54
             C -2 -62, -24 -56, -40 -40
             C -48 -32, -50 -22, -46 -14
             L -60 -20
             C -66 -30, -66 -38, -58 -44 Z"
      fill="none" stroke="#2b2b28" stroke-width="3" stroke-linejoin="round"/>
    <!-- claw split line -->
    <path d="M -6 -60 C -2 -46, 4 -34, 14 -26" fill="none" stroke="#8a8578" stroke-width="1.5"/>
  </g>

</svg>
